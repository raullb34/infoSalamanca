server {
    listen 80;
    server_name _;  # Aceptar cualquier nombre de servidor
    root /usr/share/nginx/html;
    index index.html;

    # Configurar para SPA (Single Page Application)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # El tiempo instalable en el móvil (/tiempo.html) y su service worker: siempre la última versión.
    # Va antes que la regla de los estáticos: nginx usa la primera expresión regular que encaja.
    location ~ ^/(tiempo\.html|tiempo-sw\.js|widget/.*\.js)$ {
        add_header Cache-Control "no-cache";
    }

    # Cache para archivos estáticos
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Desactivar cache para el index.html
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
}
